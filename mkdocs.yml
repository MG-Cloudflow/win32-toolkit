site_name: win32-toolkit
site_description: Turn an installer into a tested Intune Win32 app, then keep it up to date.
site_url: https://win32toolkit.com/
repo_url: https://github.com/MG-Cloudflow/win32-toolkit
repo_name: MG-Cloudflow/win32-toolkit
edit_uri: edit/main/docs/
site_author: Maxime Guillemin
copyright: >-
  Copyright &copy; 2026 Maxime Guillemin, CloudFlow.
  <a href="#__consent">Change cookie settings</a>

docs_dir: docs

# The site is built with Zensical (https://zensical.org), which reads this mkdocs.yml as is:
#   pip install zensical==0.0.73   then   zensical serve   or   zensical build --clean --strict
# Zensical has no MkDocs plugins or hooks, and renders templates with MiniJinja (see overrides/main.html).

# Links to a missing page or heading are warnings, so 'zensical build --strict' (the CI gate) fails on
# them: the pages link each other's sections, and a renamed heading must not leave a dead link behind.
validation:
  anchors: warn

theme:
  name: material
  # Zensical's own look. 'classic' would bring back the Material for MkDocs look.
  variant: modern
  language: en
  custom_dir: overrides
  logo: assets/win32-toolkit-icon.svg
  favicon: assets/win32-toolkit-icon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # 3-way: follow the OS by default, with explicit light/dark toggles.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MG-Cloudflow/win32-toolkit
  # GA4 Measurement ID is supplied at build time via the GOOGLE_ANALYTICS_KEY repo variable, so it is
  # not committed. Unset (local builds) => an empty ID; the strict build stays green either way.
  analytics:
    provider: google
    property: !ENV [GOOGLE_ANALYTICS_KEY, ""]
  # GDPR cookie consent: because an analytics cookie category is declared here, Google Analytics only
  # loads AFTER the visitor accepts. Reject or no choice => GA never runs, no cookie is set.
  consent:
    title: Cookie consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, and to measure whether
      visitors find what they are looking for in the documentation. With your consent, you help us
      make the documentation better.
    actions:
      - accept
      - reject
      - manage
    cookies:
      analytics:
        name: Google Analytics
        checked: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  # Glossary terms are links to their entry. Hovering one previews the entry; a click opens the glossary.
  - zensical.extensions.preview:
      configurations:
        - targets:
            include: [glossary.md]
          sources:
            exclude: [glossary.md]
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

