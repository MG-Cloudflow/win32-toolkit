name: Docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'README.md', 'overrides/**']
  pull_request:
    paths: ['Public/**', 'Private/**', '*.psd1', '*.psm1', 'docs/**', 'build/Update-Docs.ps1', 'mkdocs.yml', 'README.md', 'overrides/**']
  workflow_dispatch:   # manual "redeploy the docs site" button (Actions tab, or: gh workflow run docs.yml)

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # The command reference is GENERATED from comment-based help (build/Update-Docs.ps1). This job
  # fails any PR where the committed docs/reference/ no longer matches the help — one source of
  # truth, no silent drift. (Windows runner: the module imports Windows-only concepts.)
  reference-drift:
    name: Reference matches help
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate reference
        run: ./build/Update-Docs.ps1

      - name: Fail on drift
        run: |
          $diff = git status --porcelain -- docs/reference
          if ($diff) {
            git --no-pager diff -- docs/reference
            throw "docs/reference is out of date - run build/Update-Docs.ps1 and commit the result."
          }
          Write-Host 'Reference is in sync with the comment-based help.'

  # Build the site with Zensical (https://zensical.org, it reads mkdocs.yml). Runs the STRICT build on
  # PRs too — a site-breaking docs change (bad nav entry, unresolvable link or anchor) must fail the PR,
  # not the post-merge Pages deploy.
  # One-time repo setup for deployment: Settings > Pages > Source = 'GitHub Actions'.
  build-site:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned: Zensical is still 0.0.x (alpha). Upgrade on purpose, then check the site locally.
      - name: Install Zensical
        run: pip install zensical==0.0.73

      # zensical build --strict fails on links to a missing page or heading, but not on a nav entry
      # whose file is missing (mkdocs build --strict did). Check the nav here.
      - name: Check that every nav entry exists
        run: |
          missing=0
          for f in $(sed -n '/^nav:/,$p' mkdocs.yml | grep -oE '[^ :]+\.md[[:space:]]*$'); do
            if [ ! -f "docs/$f" ]; then echo "::error::nav entry not found: docs/$f"; missing=1; fi
          done
          exit $missing

      - name: Build (strict)
        run: zensical build --clean --strict
        env:
          # GA4 Measurement ID from a repo variable OR secret (the ID is public/client-side, so either
          # works; a variable is slightly more conventional). Falls back to the secret when the variable
          # is unset. Neither set => an empty ID from the !ENV default in mkdocs.yml, and the strict
          # build stays green.
          GOOGLE_ANALYTICS_KEY: ${{ vars.GOOGLE_ANALYTICS_KEY || secrets.GOOGLE_ANALYTICS_KEY }}

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
